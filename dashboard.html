<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FynixTrade Dashboard</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="https://unpkg.com/@supabase/supabase-js"></script>
  <style>
    /* ===== Dashboard Styling (Matches Existing Theme) ===== */
    .dashboard-body {
      background:#0b0f17;
      font-family: 'Inter', sans-serif;
      color: #fff;
    }

    .dashboard-header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:20px 30px;
      background:rgba(0,0,0,0.3);
      backdrop-filter:blur(8px);
      border-bottom:1px solid rgba(0,255,238,0.2);
    }

    .dash-logo { font-size:1.6rem; font-weight:700; color:#00ffee; }

    .dash-user { display:flex; align-items:center; gap:15px; }

    .logout-btn {
      padding:8px 18px;
      background:#ff2e63;
      border:none;
      border-radius:6px;
      cursor:pointer;
      color:white;
      font-weight:600;
      transition:0.2s;
    }
    .logout-btn:hover { opacity:0.8; }

    /* Wrapper */
    .dashboard-wrapper {
      display:flex;
      margin-top:10px;
    }

    /* Sidebar */
    .dashboard-sidebar {
      width:220px;
      background:#0e141f;
      min-height:100vh;
      padding:20px 0;
      border-right:1px solid rgba(0,255,238,0.15);
    }

    .dashboard-sidebar ul { list-style:none; padding:0; }
    .dashboard-sidebar li {
      padding:15px 25px;
      cursor:pointer;
      color:#a8b3c7;
      transition:0.2s;
      border-left:4px solid transparent;
    }
    .dashboard-sidebar li:hover { background:#111927; }
    .dashboard-sidebar li.active {
      background:#111927;
      color:#00ffee;
      border-left:4px solid #00ffee;
    }

    /* MAIN */
    .dashboard-main {
      flex:1;
      padding:30px;
    }

    /* Balance Cards */
    .balance-section {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
      margin-bottom:40px;
    }

    .balance-card {
      background:#111927;
      padding:20px;
      border-radius:12px;
      border:1px solid rgba(0,255,238,0.15);
      box-shadow:0 0 10px rgba(0,255,238,0.08);
    }

    .balance-card h4 { font-size:1rem; color:#8ea0c2; }
    .balance-amount { font-size:1.8rem; margin-top:10px; color:#00ffee; font-weight:700; }

    /* Portfolio */
    .portfolio-section h3,
    .transactions-section h3 { font-size:1.4rem; margin-bottom:20px; }

    .portfolio-list { margin-top:20px; display:flex; flex-direction:column; gap:12px; }

    .portfolio-item {
      background:#111927;
      padding:15px;
      border-radius:10px;
      display:flex;
      justify-content:space-between;
      border:1px solid rgba(0,255,238,0.1);
    }

    /* Transaction Table */
    .transaction-table { width:100%; border-collapse:collapse; }

    .transaction-table th,
    .transaction-table td {
      padding:14px;
      border-bottom:1px solid rgba(255,255,255,0.08);
    }

    .transaction-table th { text-align:left; color:#8ea0c2; font-weight:500; }

    /* Quick Actions */
    .quick-actions { margin-top:40px; display:flex; gap:20px; }

    .action-btn {
      padding:12px 24px;
      background:#00ffee;
      color:#001015;
      border:none;
      border-radius:8px;
      font-weight:700;
      cursor:pointer;
      transition:0.2s;
    }
    .action-btn:hover { opacity:0.85; }
  </style>
</head>
<body class="dashboard-body">

  <!-- ===== HEADER ===== -->
  <header class="dashboard-header">
    <h2 class="dash-logo">FynixTrade</h2>
    <div class="dash-user">
      <span id="usernameDisplay">Loading...</span>
      <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>
  </header>

  <!-- ===== MAIN WRAPPER ===== -->
  <div class="dashboard-wrapper">

    <!-- ===== SIDEBAR ===== -->
    <aside class="dashboard-sidebar">
      <ul>
        <li class="active">Dashboard</li>
        <li>Portfolio</li>
        <li>Transactions</li>
        <li>Deposit</li>
        <li>Withdraw</li>
        <li>Referral</li>
        <li>Settings</li>
      </ul>
    </aside>

    <!-- ===== CONTENT AREA ===== -->
    <main class="dashboard-main">

      <!-- ===== BALANCE CARDS ===== -->
      <section class="balance-section reveal">
        <div class="balance-card">
          <h4>Total Balance</h4>
          <p id="totalBalance" class="balance-amount">$0.00</p>
        </div>

        <div class="balance-card">
          <h4>Profit Today</h4>
          <p id="profitToday" class="balance-amount">$0.00</p>
        </div>

        <div class="balance-card">
          <h4>Total Deposits</h4>
          <p id="totalDeposits" class="balance-amount">$0.00</p>
        </div>

        <div class="balance-card">
          <h4>Total Withdrawals</h4>
          <p id="totalWithdrawals" class="balance-amount">$0.00</p>
        </div>
      </section>

      <!-- ===== PORTFOLIO SECTION ===== -->
      <section class="portfolio-section reveal">
        <h3>Your Portfolio</h3>
        <canvas id="portfolioChart" class="sparkline"></canvas>
        <div id="portfolioList" class="portfolio-list">
          <!-- JS will inject portfolio items here -->
        </div>
      </section>

      <!-- ===== TRANSACTION HISTORY ===== -->
      <section class="transactions-section reveal">
        <h3>Recent Transactions</h3>
        <table class="transaction-table">
          <thead>
            <tr>
              <th>Type</th><th>Amount</th><th>Status</th><th>Date</th>
            </tr>
          </thead>
          <tbody id="transactionBody">
            <!-- JS injects rows -->
          </tbody>
        </table>
      </section>

      <!-- ===== QUICK ACTIONS ===== -->
      <section class="quick-actions reveal">
        <button class="action-btn">Deposit</button>
        <button class="action-btn">Withdraw</button>
        <button class="action-btn">Start Trade</button>
      </section>

    </main>
  </div>

  <script src="assets/js/dashboard.js"></script>
  <script>
    // ===== SUPABASE INIT =====
    const supabase = window.supabase.createClient(
      "YOUR_SUPABASE_URL",
      "YOUR_SUPABASE_ANON_KEY"
    );

    // ===== PROTECT DASHBOARD =====
    (async () => {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) window.location.href = "login.html";
      else document.getElementById("usernameDisplay").textContent = user.email;
    })();

    // ===== LOGOUT =====
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await supabase.auth.signOut();
      window.location.href = "login.html";
    });

    // ===== LOAD MOCK DATA (Replace with Supabase later) =====
    document.getElementById("totalBalance").textContent = "$1,250.00";
    document.getElementById("profitToday").textContent = "+$42.00";
    document.getElementById("totalDeposits").textContent = "$4,000.00";
    document.getElementById("totalWithdrawals").textContent = "$2,750.00";

    const portfolioList = document.getElementById("portfolioList");
    const samplePortfolio = [
      { asset: "BTC", amount: "0.021", value: "$900" },
      { asset: "ETH", amount: "0.51", value: "$1,200" }
    ];

    samplePortfolio.forEach(item => {
      const div = document.createElement("div");
      div.className = "portfolio-item";
      div.innerHTML = `
        <span><strong>${item.asset}</strong> — ${item.amount}</span>
        <span>${item.value}</span>
      `;
      portfolioList.appendChild(div);
    });

    const transactions = [
      { type:"Deposit", amount:"$200", status:"Success", date:"Dec 15" },
      { type:"Profit", amount:"$12", status:"Completed", date:"Dec 15" }
    ];

    const tbody = document.getElementById("transactionBody");
    transactions.forEach(t => {
      const row = document.createElement("tr");
      row.innerHTML = `<td>${t.type}</td><td>${t.amount}</td><td>${t.status}</td><td>${t.date}</td>`;
      tbody.appendChild(row);
    });
  </script>
</body>
</html>
