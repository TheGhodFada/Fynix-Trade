<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login — FynixTrade</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <section class="auth-page">
  <div class="auth-card">
    <div class="card-head">
      <h3>Welcome back</h3>
      <span class="logo"><span class="accent">Fynix</span>Trade</span>
    </div>

    <p class="lead">Sign in to continue to your dashboard.</p>

    <form id="loginForm" class="auth-form" autocomplete="on">
  <div class="input-group">
    <label for="loginEmail">Email</label>
    <input id="loginEmail" name="email" type="email" placeholder="you@domain.com" required />
  </div>

  <div class="input-group">
    <label for="loginPassword">Password</label>
    <input id="loginPassword" name="password" type="password" placeholder="••••••••" required />
    <button type="button" class="input-toggle" aria-label="Toggle password" aria-pressed="false">Show</button>
  </div>

  <!-- inline error container -->
  <div id="loginError" class="error" role="alert" aria-live="assertive" style="display:none"></div>

  <div class="auth-actions">
    <div class="left">
      <button id="loginBtn" type="submit" class="btn primary">Sign in</button>
    </div>
    <div class="right auth-aux">
      <a href="forgot.html">Forgot password?</a>
    </div>
  </div>
</form>
  </div>
</section>

  <script type="module" src="assets/js/supabase.js"></script>
  <script type="module" src="assets/js/auth.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
